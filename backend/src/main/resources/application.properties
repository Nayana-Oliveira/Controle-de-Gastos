spring.application.name=gastos

# Configuração da conexão com o banco de dados (H2 em modo arquivo)
spring.datasource.url=jdbc:h2:file:./data/gastosdb
spring.datasource.username=admin
spring.datasource.password=controle_admin2026

# Configuração do Hibernate/JPA para criar e atualizar as tabelas automaticamente
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Configuração do console web do H2 (acesso local em /h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console